<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <a href="./index.html">
                    <li>Inicio</li>
                </a>
                <a href="./sesion.html">
                    <li>Entrar</li>
                </a>
                <a href="./registro.html">
                    <li>Registrarme</li>
                </a>
            </ul>
        </nav>
    </header>
    <h2>Duver Shops</h2>
    <main>

        <section class="principal">
            <article>
                <figure>
                    <img src="./img/product-1.jpg" alt="">
                    <figcaption>Camiseta</figcaption>
                    <p>14.99$</p>
                    <button>Comprar</button>
                </figure>
                
            </article>
            <article>
                <figure>
                    <img src="./img/product-2.jpg" alt="">
                    <figcaption>Camara</figcaption>
                    <p>49.99$</p>
                    <button>Comprar</button>
                </figure>
                <div class="boton">
                    
                </div>
            </article>

            <article>
                <figure>
                    <img src="./img/product-3.jpg" alt="">
                    <figcaption>Portatil</figcaption>
                    <p>499.99$</p>
                    <button>Comprar</button>
                </figure>
                <div class="boton">
                    
                </div>
            </article>
            <article>
                <figure>
                    <img src="./img/product-4.jpg" alt="">
                    <figcaption>Zapatillas</figcaption>
                    <p>29.99$</p>
                    <button>Comprar</button>
                </figure>
                
            </article>


            <div class="carro">
                <h4>Mi Carrito</h4>

                <div class="carrito">
                    <figure>
                        <img src="./img/product-2.jpg" alt="Camara">
                        
                    </figure>

                    <div class="textos">
                        <p>Camara</p>

                        <div class="cant">
                            <div>-</div>
                            <div>2</div>
                            <div>+</div>
                        </div>
                        <p>49.99</p>
                    </div>
                </div>

                <div class="carrito">
                    <figure>
                        <img src="./img/product-3.jpg" alt="Producto 3">

                    </figure>
                    <div class="textos">
                        <p>Portatil</p>

                        <div class="cant">
                            <div>-</div>
                            <div>2</div>
                            <div>+</div>
                        </div>
                        <p>999.98$</p>
                    </div>

                </div>

                <div class="carrito">
                    <figure>
                        <img src="./img/product-4.jpg" alt="Portatil">
                    </figure>

                    <div class="textos">
                        <p>Portatil</p>

                        <div class="cant">
                            <div>-</div>
                            <div>2</div>
                            <div>+</div>
                        </div>
                        <p>29.99$</p>
                    </div>
                </div>
                <button class="todo">Comprar Todo</button>
            </div>
        </section>
    </main>
</body>

</html>
