<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Duver Shops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <header class="w-100">
        <nav class="navbar  navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand text-white fw-bold" href="#">Duver Shops</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="#">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="./sesion.html">Entrar</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="#">Registrarme</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        <h3 class="text-center my-4">Duver Shops</h3>
        
        <div class="container">
            <div class="row g-4">
                
                <div class="col-lg-9">
                    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">
                        
                        <div class="col">
                            <img src="./img/product-1.jpg" class="img-fluid" alt="Camiseta">
                            <p class="text-center fw-bold text-secondary fs-6 mb-0 mt-2">Camiseta</p>
                            <p class="text-center fw-bold text-secondary fs-6 mb-2">14.99$</p>
                            <div class="d-flex justify-content-center">
                                <button type="button" class="btn btn-primary fw-bold w-100">Comprar</button>
                            </div>
                        </div>

                        <div class="col">
                            <img src="./img/product-2.jpg" class="img-fluid" alt="Camara">
                            <p class="text-center fw-bold text-secondary fs-6 mb-0 mt-2">Camara</p>
                            <p class="text-center fw-bold text-secondary fs-6 mb-2">49.99$</p>
                            <div class="d-flex justify-content-center">
                                <button type="button" class="btn btn-primary fw-bold w-100">Comprar</button>
                            </div>
                        </div>

                        <div class="col">
                            <img src="./img/product-3.jpg" class="img-fluid" alt="Portatil">
                            <p class="text-center fw-bold text-secondary fs-6 mb-0 mt-2">Portatil</p>
                            <p class="text-center fw-bold text-secondary fs-6 mb-2">499.99$</p>
                            <div class="d-flex justify-content-center">
                                <button type="button" class="btn btn-primary fw-bold w-100">Comprar</button>
                            </div>
                        </div>

                        <div class="col">
                            <img src="./img/product-4.jpg" class="img-fluid" alt="Zapatillas">
                            <p class="text-center fw-bold text-secondary fs-6 mb-0 mt-2">Zapatillas</p>
                            <p class="text-center fw-bold text-secondary fs-6 mb-2">29.99$</p>
                            <div class="d-flex justify-content-center">
                                <button type="button" class="btn btn-primary fw-bold w-100">Comprar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3">
                    <div class="p-3" style="background-color: rgb(140, 159, 221);">
                        <h6 class="text-center mb-3">Mi Carrito</h6>

                        <div class="d-flex mb-3 pt-2 pb-2 align-items-start ">
                            <img src="./img/product-2.jpg" class="img-fluid rounded me-3" style="width: 80px; height: 80px; object-fit: cover;" alt="Camara">
                            <div class="flex-grow-1">
                                <p class="fw-bold mb-1">Camara</p>
                                <div class="d-flex align-items-center border border-black rounded p-1 mb-1 fw-bold" style="width: 100px;">
                                    <div class="px-2 cursor-pointer">-</div>
                                    <div class="px-2">2</div>
                                    <div class="px-2 cursor-pointer">+</div>
                                </div>
                                <p class="fw-bold mb-0">99.98$</p>
                            </div>
                        </div>

                        <div class="d-flex mb-3 pt-2 pb-2 align-items-start">
                            <img src="./img/product-3.jpg" class="img-fluid rounded me-3" style="width: 80px; height: 80px; object-fit: cover;" alt="Portatil">
                            <div class="flex-grow-1">
                                <p class="fw-bold mb-1">Portatil</p>
                                <div class="d-flex align-items-center border border-black rounded p-1 mb-1 fw-bold" style="width: 100px;">
                                    <div class="px-2 cursor-pointer">-</div>
                                    <div class="px-2">2</div>
                                    <div class="px-2 cursor-pointer">+</div>
                                </div>
                                <p class="fw-bold mb-0">999.98$</p>
                            </div>
                        </div>

                        <div class="d-flex mb-3 pt-2 pb-2 align-items-start">
                            <img src="./img/product-4.jpg" class="img-fluid rounded me-3" style="width: 80px; height: 80px; object-fit: cover;" alt="Zapatillas">
                            <div class="flex-grow-1">
                                <p class="fw-bold mb-1">Zapatillas</p>
                                <div class="d-flex align-items-center border border-black rounded p-1 mb-1 fw-bold" style="width: 100px;">
                                    <div class="px-2 cursor-pointer">-</div>
                                    <div class="px-2">1</div>
                                    <div class="px-2 cursor-pointer">+</div>
                                </div>
                                <p class="fw-bold mb-0">29.99$</p>
                            </div>
                        </div>
                        
                        <div class="d-flex flex-row justify-content-between mt-3" style="gap: 80px;"> 
                            <p class="mb-0">Total</p>
                            <p class="text-primary mb-0 fw-bold">1079.95$</p>
                        </div>
                        
                        <button type="button" class="btn btn-primary fw-bold mt-2" style="width: 100%; height: 35px;">Comprar</button>
                    </div>
                </div>

            </div>
        </div>
    </main>


    
    <footer class="w-100 mt-5 mb-4">
        <nav class="navbar navbar-expand-lg bg-primary w-100">
            <div class="container-fluid">
                <div class="collapse navbar-collapse justify-content-center" id="footerNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="#">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="#">Carrito</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="#">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
