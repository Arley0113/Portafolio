<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción de Cursos Programación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center mb-4">Inscripción a Cursos de Programación</h2>
        
        <form>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="number" class="form-control" id="telefono">
            </div>
            
            <div class="mb-3">
                <label for="curso" class="form-label">Curso de interés</label>
                <select class="form-select" id="curso" required>
                    <option value="" selected disabled>Selecciona un curso</option>
                    <option value="python">Curso de Python</option>
                    <option value="React">Curso de React</option>
                    <option value="JavaScript">Curso de JavaScript</option>
                    <option value="PHP">Curso de PHP</option>
                    <option value="Bootstrap">Curso de Bootstrap</option>
                    <option value="Ruby">Curso de Ruby</option>
                </select>
            </div>
            
         <div class="form-floating">
            <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
            <label for="floatingTextarea">Comments</label>
        </div>
            <button type="submit" class="btn btn-primary btn-submit">Enviar inscripción</button>
        </form>

      
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
