        <h3>Contacto</h3>
        <figure class="destacada3">
            <img src="../img/destacada3.jpg" alt="apto">
        </figure>
        <section>
            <h3>Llene el formulario de contacto</h3>
            <form>
                <fieldset>
                    <legend>Informacion Personal</legend>
                    <label for="">NOMBRE</label>
                    <br>
                    <input type="text" placeholder="Tu Nombre">

                    <label for="">E-MAIL</label>
                    <input type="email" placeholder="Tu Email">

                    <label for="">TELÉFONO</label>
                    <input type="number" placeholder="Tu Teléfono">

                    <label  for="">MENSAJE:</label>
                    <input  type="text" class="grande">

                </fieldset>
                <fieldset>
                    <legend>Informacion sobre la propiedad</legend>
                    <label for="">VENDE O COMPRA:</label>
                    <select name="" id="" >
                        <option value="">--Seleccione--</option>
                        <option value="">VENDE</option>
                        <option value="">COMPRA</option>
                    </select>
                    

                </fieldset>
                <fieldset>
                    <legend>Informacion sobre la propiedad</legend>
                    <label class="texto_pequeño">Como desea ser contactado</label>

                    <label>TELÉFONO</label><input type="radio" >
                    <label>E-MAIL</label><input type="radio" >

                    <label class="texto_pequeño">Si eligió Teléfono, elija la fecha y la hora</label>
                    <label for="FECHA:"></label>
                    <input type="date" placeholder="date">

                    <label for="">HORA:</label>
                    <input type="time" placeholder="time">

                </fieldset>
                <input type="submit" placeholder="Enviar">
            </form>
        </section>
